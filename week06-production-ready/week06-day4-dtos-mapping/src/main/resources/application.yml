spring:
  application:
    name: week6-day4-dtos-mapping

  # ── Database ──────────────────────────────────────────────────────────────
  # Switch the active profile to switch between H2 (local) and PostgreSQL (real)
  profiles:
    active: local   # change to "postgres" when you have PostgreSQL running

  # H2 console — only active on "local" profile (see below)
  h2:
    console:
      enabled: true
      path: /h2-console

# ── Profile: local (H2 in-memory — no setup needed) ──────────────────────
---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:librarydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop   # wipes and recreates schema on every restart
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# ── Profile: postgres (real PostgreSQL) ───────────────────────────────────
---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: jdbc:postgresql://localhost:5432/librarydb
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update   # safe for dev; use Flyway/Liquibase in production
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# ── Server ────────────────────────────────────────────────────────────────
server:
  port: 8080

# ── Logging ───────────────────────────────────────────────────────────────
logging:
  level:
    com.JavaBackEnd: DEBUG
    org.springframework.security: WARN
